// ---------- geometry (cassette pixels; a compact cassette is 100.4 x 63.8 mm) ----------
const W = 160, H = 102;
const PAD_X = 12, PAD_T = 7, PAD_B = 24;             // room for the turn, the lift and spilled tape
const CW = W + 2 * PAD_X, CH = H + PAD_T + PAD_B;

const HUB_L = { x: 62, y: 49 }, HUB_R = { x: 98, y: 49 };
const ROLL_L = { x: 20, y: 96 }, ROLL_R = { x: 140, y: 96 };
const R_HUB = 5, R_CORE = 6, R_FULL = 17;
const PACK_AREA = R_FULL * R_FULL - R_CORE * R_CORE;   // tape is conserved: rL^2 + rR^2 = const
const OPENINGS = [[16, 24], [46, 56], [72, 88], [104, 114], [136, 144]];

// ---------- pixel font: 3x5 ----------
const GLYPHS = {
  A:"010101111101101", B:"110101110101110", C:"011100100100011", D:"110101101101110",
  E:"111100110100111", F:"111100110100100", G:"011100101101011", H:"101101111101101",

const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
let g;
const px = (x, y, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); };
const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const textW = s => s.length * 4 - 1;
function text(s, x, y, c) {

function drawSticker(s) {
  const r = rng(s.seed);
  const x0 = 9, y0 = 7, w = W - 18, h = 59;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const edge = Math.min(x, y, w - 1 - x, h - 1 - y), p = r();
    if (edge < 2 && p < 0.24 - edge * 0.09) continue;

  }
  for (let i = 0; i < 8; i++) rect(x0 + w - 8 + i, y0, 8 - i, 1, "#2b2926");
  for (const y of [y0 + 19, y0 + 22]) for (let x = 5; x < w - 5; x++) if (r() > 0.12) px(x0 + x, y, "#d8cba9");

  for (let a = 0; a < 48; a++) {
    const t = a / 48 * Math.PI * 1.5 + 0.4;
    if (r() < 0.7) px(cx + Math.round(Math.cos(t) * 10), cy + Math.round(Math.sin(t) * 7), "#d6c49e");
  }

  line(x0 + 20, y0 + 52, x0 + 31, y0 + 48, "#d9cba8");
  for (let x = 0; x < w; x++) if (r() > 0.07) rect(x0 + x, y0 + 25, 1, 4, s.stripe);

  text(s.title, x0 + 17, y0 + 5, "#2a241c");
  text(s.line2, x0 + 17, y0 + 12, "#6a5f4e");

  text("TYPE I", x0 + w - 6 - textW("TYPE I"), y0 + 50, "#7a6e5a");
  for (let i = 0; i < 9; i++) px(x0 + 8 + i, y0 + 41, "#b9aa86");
  px(x0 + 15, y0 + 40, "#b9aa86"); px(x0 + 15, y0 + 42, "#b9aa86");

// ---------- positions along a side ----------
function sidePos(i) {
  let t = 0; for (let k = 0; k < qi[i]; k++) t += SIDES[i].tracks[k].len;
  return t + (audio[i] ? audio[i].currentTime : 0);

function progress(i) { return Math.min(1, Math.max(0, sidePos(i) / SIDES[i].total)); }

  while (k < tr.length - 1 && sec >= tr[k].len) { sec -= tr[k].len; k++; }
  return [k, Math.min(sec, tr[k].len - 0.5)];
}
function seekSide(i, sec) {
  const [k, off] = locate(i, sec), a = audio[i];
  if (k !== qi[i]) {
    const wasPlaying = !a.paused;
    load(i, k, false);
    a.addEventListener("loadedmetadata", () => { a.currentTime = off; if (wasPlaying) a.play().catch(() => {}); }, { once: true });

function packRadii(p) {
  return [Math.sqrt(R_CORE * R_CORE + PACK_AREA * (1 - p)), Math.sqrt(R_CORE * R_CORE + PACK_AREA * p)];
}

// ---------- the moving parts ----------
function drawPack(c, r, ang) {
  const R = Math.ceil(r);
  for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
    const d = Math.sqrt(x * x + y * y);
    if (d > r) continue;
    px(c.x + x, c.y + y, d > r - 1 ? "#5e4433" : (d * 1.4 | 0) % 3 === 0 ? "#42301f" : "#4a3426");
  }
  for (let k = 0; k < 4; k++) {
    const rr = R_CORE + 1 + (k * 2.7 + 1) % Math.max(1, r - R_CORE - 1), t = ang + k * 1.9;
    if (rr < r - 1) px(c.x + Math.round(Math.cos(t) * rr), c.y + Math.round(Math.sin(t) * rr), "#6b4e3a");
  }
}
function drawHub(c, ang) {
  disc(c.x, c.y, R_HUB, "#d9d3c7");
  px(c.x - 2, c.y - 4, "#f2eee6"); px(c.x - 3, c.y - 3, "#f2eee6");
  disc(c.x, c.y, 3, "#141312");
  for (let k = 0; k < 6; k++) {
    const t = ang + k * Math.PI / 3;
    px(c.x + Math.round(Math.cos(t) * 2.6), c.y + Math.round(Math.sin(t) * 2.6), "#d9d3c7");
  }

function tangent(c, r, p, pickMinX) {
  const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx), b = Math.acos(Math.min(1, r / d));
  const t1 = { x: c.x + r * Math.cos(a + b), y: c.y + r * Math.sin(a + b) };
  const t2 = { x: c.x + r * Math.cos(a - b), y: c.y + r * Math.sin(a - b) };
  return (t1.x < t2.x) === pickMinX ? t1 : t2;
}

function drawCassette(t, i) {
  g = frame.getContext("2d");
  g.clearRect(0, 0, W, H);
  g.drawImage(bases[i], 0, 0);
  const [rL, rR] = packRadii(progress(i));
  g.save(); g.beginPath(); g.rect(WIN.x, WIN.y, WIN.w, WIN.h); g.clip();
  drawPack(HUB_L, rL, st.angL); drawPack(HUB_R, rR, st.angR);
  const tl = tangent(HUB_L, rL, ROLL_L, true), tr = tangent(HUB_R, rR, ROLL_R, false);
  line(tl.x, tl.y, ROLL_L.x, ROLL_L.y, "#3b2a1e");
  line(tr.x, tr.y, ROLL_R.x, ROLL_R.y, "#3b2a1e");
  drawHub(HUB_L, st.angL); drawHub(HUB_R, st.angR);
  for (let x = WIN.x + 4, k = 0; x < WIN.x + WIN.w - 3; x += 4, k++) rect(x, WIN.y + 1, 1, k % 5 ? 1 : 2, "#77716a");
  // slack tape sagging across the window when something is wrong
  if (st.trouble && st.trouble.kind !== "stick") for (let x = 66; x < 96; x++)
    px(x, WIN.y + WIN.h - 3 + Math.round(Math.sin((x - 66) / 30 * Math.PI) * 2 + Math.sin(t / 140 + x / 3) * 0.6), "#5e4433");
  if (st.glintT >= 0) {
    const gx = WIN.x - 12 + (t - st.glintT) / 600 * (WIN.w + 24);

  poly([[29, 129], [37, 128], [39, 133], [29, 134]], (x, y) => y > 132 ? C.shoeB : x < 31 ? C.shoeS : C.shoe);
  poly([[38, 128], [47, 127], [52, 133], [51, 136], [38, 135]], (x, y) => y > 133 ? C.shoeB : y < 129 ? C.shoeS : C.shoe);
  for (const x of [41, 43, 45]) P(x, 129, C.ink);                // laces
  P(33, 130, C.ink); P(35, 130, C.ink);
  poly([[36, 66], [50, 63], [53, 75], [49, 93], [35, 95]], (x, y) => (x > 50 ? C.plaidS : plaidAt(x, y)));
  const ax0 = 48, ay0 = 69, ax1 = 70, ay1 = 87, al = Math.hypot(ax1 - ax0, ay1 - ay0);
  band(ax0, ay0, ax1, ay1, 6, 3.4, (x, y, s) => {
    const u = Math.round(((x - ax0) * (ax1 - ax0) + (y - ay0) * (ay1 - ay0)) / al);
    const v = Math.round(((x - ax0) * -(ay1 - ay0) + (y - ay0) * (ax1 - ax0)) / al);
    return s > 0.82 ? C.plaidS : plaidAt(u, v);
  });
  rect(69, 85, 2, 4, C.strap); P(70, 86, C.green);
  ellipse(73.5, 88, 3, 1.8, C.skin); P(72, 89, C.skinS); P(76, 89, C.skin);
  band(45, 66, 40, 96, 1.2, 1.2, C.strap);
  poly([[41, 78], [47, 77], [48, 87], [42, 88]], (x, y) => (x === 42 || y === 78 ? "#3c3c48" : C.strap));
  poly([[31, 60], [46, 57], [52, 65], [45, 72], [33, 69]], (x, y) =>
    y < 60 || (x < 34 && y < 64) ? C.bagL : (x + y) % 7 === 0 ? C.bagS : y > 68 || x > 48 ? C.bagS : C.bag);
  poly([[18, 66], [39, 63], [42, 93], [24, 99], [17, 90]], packAt);
  band(17, 66, 17, 93, 1, 1, C.ink);
  poly([[17, 89], [24, 95], [31, 97], [24, 100], [17, 94]], (x, y) => (y > 97 ? C.packS : (x + y) % 3 ? C.pack : C.packS));
  // head in profile, dark beard; a white cap with a black underbrim and a wing badge
  ellipse(55, 61, 3.2, 3.8, C.skin);
  poly([[53, 61], [58, 60], [59, 64], [56, 67], [52, 65]], C.beard);
  P(57, 59, C.skin); P(58, 59, C.skinS); P(53, 60, C.skinS);
  ellipse(53, 56.5, 5.5, 3.6, (x, y) => (y > 57 ? C.capS : C.cap));
  poly([[56, 57], [63, 57.5], [62, 60], [56, 59.5]], (x, y) => (y >= 59 ? C.brim : C.cap));
  P(51, 55, C.ink); P(52, 55, C.logo); P(53, 55, C.ink);
}

// ---------- the moving parts ----------
function weeds(t, w) {
  for (const [x, y, h] of WEEDS) for (let k = 0; k < h; k++) {
    const sway = Math.round(w * 1.4 * (k / h) + Math.sin(t / 380 + x) * 0.5 * (k / h));
    const sx = x + Math.round(Math.sin(k * 0.9 + x) * 1.2) + sway;
    P(sx, y - k, k % 3 ? C.grass : C.grassL);
    if (k % 2 && hash(x, k) < 0.7) { P(sx - 1, y - k, C.grassL); P(sx + 1, y - k + 1, C.grass); }
  }
}
function backDeerHead(t) {
  const up = (t % 9000) > 7000;
  const hy = up ? 49.5 : 52.5;
  ellipse(84, hy, 2.9, 3.1, C.ink); ellipse(84, hy, 2, 2.2, up ? C.deer : C.deerD);
  P(82, hy - 3, C.ink); P(82, hy - 4, C.deerD); P(86, hy - 3, C.ink); P(86, hy - 4, C.deerD);
  if (up) { P(83, hy, C.eye); P(85, hy, C.eye); P(84, hy + 1, C.nose); }
}
const SPOTS = [[87, 75], [90, 74], [93, 73], [96, 72], [99, 72], [102, 72], [89, 77], [92, 76], [95, 75], [98, 75], [101, 75], [104, 74], [94, 78], [97, 78], [100, 78]];
let alertUntil = 0;
function fawn(t) {
  const alert = t < alertUntil || (t % 12000) < 1500;
  const hy = alert ? -3 : ((t / 650) | 0) % 5 === 0 ? 1 : 0;   // bobbing while eating, up when alert
  const blink = (t % 5200) < 140, twitch = !alert && (t % 3700) < 220, flick = (t % 2900) < 260;
  const chew = !alert && ((t / 260) | 0) % 2;
  const leg = (x0, y0, x1, y1, lit) => {
    band(x0, y0, x1, y1, 3, 2.4, C.ink);
    band(x0, y0, x1, y1, 1.6, 1.2, (x, y, s, tt) => (tt > 0.92 ? C.nose : s < 0.5 && lit ? C.deerL : C.deerD));
  };
  leg(104, 80, 107, 97, false); leg(101, 81, 103, 104, false);
  leg(89, 84, 89, 106, true); leg(86, 83, 85, 104, true);
  ellipse(95, 78.5, 13, 7.2, C.ink, -0.18);
  ellipse(95, 78.5, 12, 6.3, (x, y, d, u, v) => {
    if (v < -0.72 && u < 0.6) return C.rim;
    if (v < -0.5 && v > -0.72 && u > -0.85) return C.stripe;     // the dark line down the spine
    if (v > 0.55) return d > 0.8 ? C.deerD : C.deer;
    if (v > 0.25 && u > -0.6) return C.deerW;
    return v < -0.3 ? C.deerL : C.deer;
  }, -0.18);
  for (const [x, y] of SPOTS) P(x, y, C.deerW);
  P(108, 73, C.ink); P(108, 74, flick ? C.deerW : C.ink); P(109, flick ? 72 : 75, flick ? C.deerW : C.deerD);
  band(87, 77, 82, 85 + hy, 6.5, 5.5, C.ink);
  band(87, 77, 82, 85 + hy, 5, 4, (x, y, s) => (s < 0.25 ? C.rim : s > 0.75 ? C.deerW : C.deer));
  // ears: large, dark-rimmed, pale inside; one twitches back, both prick up when alert
  const ear = (o, i) => { poly(o, C.ink); poly(i, C.earIn); };
  const Y = p => p.map(([x, y]) => [x, y + hy]);
  ear(Y([[78, 85], [72, 78], [76, 77], [81, 83]]), Y([[78, 84], [74, 79], [76, 79], [79, 83]]));
  if (twitch) ear(Y([[84, 84], [90, 81], [91, 83], [85, 86]]), Y([[85, 84], [89, 82], [90, 83], [86, 85]]));
  else ear(Y([[83, 84], [86, 76], [89, 77], [86, 85]]), Y([[84, 83], [86, 78], [87, 78], [86, 84]]));
  ellipse(80.5, 87 + hy, 4.3, 3.6, C.ink, 0.4);
  ellipse(80.5, 87 + hy, 3.5, 2.9, (x, y, d, u, v) => (v < -0.5 ? C.rim : C.deer), 0.4);
  ellipse(77.8, 89 + hy, 2.2, 1.6, C.deerL);
  P(80, 89 + hy, C.deerW); P(81, 90 + hy, C.deerW);
  if (blink) { P(80, 86 + hy, C.ink); P(81, 86 + hy, C.ink); }
  else { for (const [x, y] of [[80, 85], [81, 85], [80, 86], [81, 86]]) P(x, y + hy, C.eye); P(80, 85 + hy, "#ffffff"); }
  P(75, 89 + hy + chew, C.nose); P(76, 89 + hy, C.nose); P(76, 90 + hy, C.nose);
}
function bird(t) {
  const n = (t / 14000) | 0, p = (t % 14000) / 6000;
  if (p > 1) return;
  const dir = n % 2 ? -1 : 1, x = dir > 0 ? -4 + p * 128 : 124 - p * 128, y = 10 + (n % 3) * 7 + Math.sin(t / 420) * 2;
  const up = ((t / 140) | 0) % 2;
  P(x, y, C.bird); P(x - 1, y - up, C.bird); P(x + 1, y - up, C.bird);
  if (!up) { P(x - 2, y + 1, C.bird); P(x + 2, y + 1, C.bird); }
}

// ---------- light and air ----------
const MOTES = Array.from({ length: 52 }, () => ({ x: R() * W, y: 20 + R() * 130, vx: 0, vy: 0, ph: R() * 6.28 }));
const PUFF = [];
const LEAVES = Array.from({ length: 4 }, (_, i) => ({ x: R() * W, y: -R() * 160, ph: R() * 6.28, sp: 5 + R() * 4, c: i % 2 ? C.yLeaf : C.gBright, loop: true }));
let pointer = null, glintSites = [], rowDx = new Int8Array(H);

function wind(t) {
  const gust = Math.pow(Math.max(0, Math.sin(t / 7000)), 8) * 1.3;
  return 0.55 * Math.sin(t / 2600) + 0.3 * Math.sin(t / 1100 + 1) + gust;
}
function findGlints() {
  const d = CANOPY.getContext("2d").getImageData(0, 0, W, 94).data, s = [];
  const solid = (x, y) => d[(y * W + x) * 4 + 3] > 0;
  for (let y = 1; y < 93; y++) for (let x = 1; x < W - 1; x++)
    if (solid(x, y) && (!solid(x + 1, y) || !solid(x, y - 1))) s.push([x, y]);
  return s;
}

let raf = 0, last = 0, tsAcc = 0, visible = false;
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
  const w = wind(t);
  g = out;
  out.clearRect(0, 0, W, H);
  out.drawImage(SKY, 0, 0);
  // the canopy sways: rows shift with the wind, the crown more than the base
  for (let y = 0; y < 94; y++) {
    rowDx[y] = Math.round(w * 2.2 * (1 - y / 94) + Math.sin(t / 400 + y / 7) * 0.45 * Math.abs(w));
    out.drawImage(CANOPY, 0, y, W, 1, rowDx[y], y, W, 1);
  }
  out.drawImage(SCENE, 0, 0);
  weeds(t, w); backDeerHead(t); fawn(t); bird(t);

  // dappled light (faster in a gust), plus the dissolve that brings the wood in on scroll
  tsAcc += dt * (1 + Math.abs(w) * 1.5);
  const ts = Math.floor(tsAcc * 8) / 8;
  const rc = cv.getBoundingClientRect();
  const reveal = Math.max(0, Math.min(1, (innerHeight - rc.top) / (rc.height * 0.75)));
  const img = out.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (reveal < 1 && (BAYER[(y >> 1) & 3][(x >> 1) & 3] + 0.5) / 16 > reveal) { d[i] = 26; d[i + 1] = 20; d[i + 2] = 14; continue; }
    if (y < 50 || y < groundTop(x) - 18 || d[i + 2] > d[i] + 20) continue;
    const n = noise(x / 5 + ts * 0.35, y / 4 - ts * 0.12) * 0.6 + noise(x / 2.2 - ts * 0.5, y / 2.2) * 0.4;
    if (n > 0.66) {
      const k = n > 0.74 ? 0.38 : 0.2;
      d[i] += (255 - d[i]) * k; d[i + 1] += (236 - d[i + 1]) * k; d[i + 2] += (180 - d[i + 2]) * k * 0.6;
    } else if (n < 0.22) { d[i] *= 0.82; d[i + 1] *= 0.8; d[i + 2] *= 0.84; }
  }
  out.putImageData(img, 0, 0);
  if (reveal > 0.95) air(t, dt, w);
  raf = visible ? requestAnimationFrame(frame) : 0;
  if (!raf) last = 0;
}
function air(t, dt, w) {
  for (let k = 0; k < 7; k++) {                                  // sun winking through the leaves
    const [x, y] = glintSites[(hash(k, Math.floor(t / 180)) * glintSites.length) | 0];
    const sx = x + rowDx[y];
    P(sx, y, "#fff6d6"); if (k < 2) { P(sx - 1, y, "#f2e2a0"); P(sx, y + 1, "#f2e2a0"); }
  }
  for (const m of MOTES) {                                        // motes ride the wind and shy from the pointer
    const tvx = w * 5 + Math.sin(t / 1700 + m.ph) * 2, tvy = -1.5 + Math.sin(t / 1300 + m.ph * 2) * 1.5;
    const k = Math.min(1, dt * 1.5);
    m.vx += (tvx - m.vx) * k; m.vy += (tvy - m.vy) * k;
    if (pointer) {
      const dx = m.x - pointer.x, dy = m.y - pointer.y, dd = Math.hypot(dx, dy) || 1;
      if (dd < 16) { const f = (1 - dd / 16) * 160 * dt; m.vx += dx / dd * f; m.vy += dy / dd * f; }
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.x < 0) m.x += W; if (m.x >= W) m.x -= W;
    if (m.y < 16) m.y = 150; if (m.y > 156) m.y = 20;
    const a = 0.5 + 0.5 * Math.sin(t / 600 + m.ph * 3);
    if (a > 0.45) { g.globalAlpha = a; P(m.x, m.y, "#fff4c8"); g.globalAlpha = 1; }
  }
  for (let k = PUFF.length - 1; k >= 0; k--) {                   // dust kicked up by a tap
    const p = PUFF[k];
    p.vy += 40 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { PUFF.splice(k, 1); continue; }
    g.globalAlpha = Math.min(1, p.life * 2); P(p.x, p.y, p.c); g.globalAlpha = 1;
  }
  for (let k = LEAVES.length - 1; k >= 0; k--) {                 // leaves spinning down
    const l = LEAVES[k];
    l.y += l.sp * dt; l.x += (w * 6 + Math.sin(t / 700 + l.ph) * 4) * dt;
    if (l.y > 175) { if (l.loop) { l.y = -10; l.x = R() * W; } else { LEAVES.splice(k, 1); continue; } }
    const x = ((l.x % W) + W) % W, flat = Math.sin(t / 300 + l.ph) > 0;
    P(x, l.y, l.c); if (flat) P(x + 1, l.y, l.c); else P(x, l.y + 1, C.gSun);
  }
}

// ---------- touching the wood ----------
const toScene = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
cv.addEventListener("pointermove", e => { pointer = toScene(e); });
cv.addEventListener("pointerleave", () => { pointer = null; });
cv.addEventListener("pointerdown", e => {
  const p = toScene(e), t = performance.now();
  if (p.x > 72 && p.x < 112 && p.y > 70 && p.y < 108) { alertUntil = t + 1800; return; }   // the fawn looks up
  if (p.y < groundTop(p.x) - 6) {                                  // a branch is shaken: leaves come down
    for (let k = 0; k < 4; k++) LEAVES.push({ x: p.x + (R() - 0.5) * 8, y: p.y + (R() - 0.5) * 4, ph: R() * 6.28, sp: 6 + R() * 6, c: k % 2 ? C.yLeaf : C.leafL, loop: false });
    return;
  }
  for (let k = 0; k < 9; k++)                                     // a puff of dust
    PUFF.push({ x: p.x, y: p.y, vx: (R() - 0.5) * 30, vy: -10 - R() * 25, life: 0.5 + R() * 0.5, c: k % 3 ? C.gBright : "#fff4c8" });
  for (const m of MOTES) { const dx = m.x - p.x, dy = m.y - p.y, dd = Math.hypot(dx, dy) || 1; if (dd < 22) { m.vx += dx / dd * 30; m.vy += dy / dd * 30; } }
});

function fit() {
  const k = Math.max(1, Math.floor(Math.min(innerWidth * 0.94 / W, innerHeight * 0.86 / H)));
  cv.style.width = W * k + "px"; cv.style.height = H * k + "px";
}
paintSky(); paintCanopy(); paintScene();
glintSites = findGlints();
fit(); addEventListener("resize", fit);
new IntersectionObserver(([en]) => {
  visible = en.isIntersecting;
  if (visible && !raf) raf = requestAnimationFrame(frame);
}).observe(cv);
})();
</script>
</body>
</html>
